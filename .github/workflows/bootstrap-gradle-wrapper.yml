name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-gradle-wrapper.yml

permissions:
  contents: write

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.1'
      - name: Generate Gradle Wrapper
        run: |
          gradle wrapper --gradle-version 9.8.1 --distribution-type bin
          chmod +x gradlew
      - name: Build the packaged Agent
        run: |
          ./gradlew :agent:shadowJar --no-daemon
          jar tf agent/build/libs/datafox-javaagent-0.1.0-SNAPSHOT.jar | grep -F 'inst/com/datafox/opentelemetry/resource/DatafoxDistroResourceProvider.classdata'
          jar tf agent/build/libs/datafox-javaagent-0.1.0-SNAPSHOT.jar | grep -F 'inst/META-INF/services/io.opentelemetry.sdk.autoconfigure.spi.ResourceProvider'
          unzip -p agent/build/libs/datafox-javaagent-0.1.0-SNAPSHOT.jar META-INF/MANIFEST.MF | grep -F 'Premain-Class: io.opentelemetry.javaagent.OpenTelemetryAgent'
      - name: Commit Wrapper
        run: |
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add Gradle 9.8.1 wrapper"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
