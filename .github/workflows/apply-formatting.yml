name: Apply Java and Gradle formatting

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-formatting.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Apply repository formatting
        run: ./gradlew spotlessApply --no-daemon
      - name: Commit formatting changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply Splunk-aligned Spotless formatting"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
