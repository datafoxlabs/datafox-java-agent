name: Build Datafox Java Agent

on:
  push:
    branches: [main]
    paths:
      - agent/**
      - bootstrap/**
      - custom/**
      - buildSrc/**
      - dependencyManagement/**
      - instrumentation/**
      - smoke-tests/**
      - testing/**
      - gradle/**
      - gradlew
      - gradlew.bat
      - settings.gradle.kts
      - build.gradle.kts
      - version.gradle.kts
      - .github/workflows/agent-build.yml
  pull_request:
    paths:
      - agent/**
      - bootstrap/**
      - custom/**
      - buildSrc/**
      - dependencyManagement/**
      - instrumentation/**
      - smoke-tests/**
      - testing/**
      - gradle/**
      - gradlew
      - gradlew.bat
      - settings.gradle.kts
      - build.gradle.kts
      - version.gradle.kts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and unit test
        run: ./gradlew build --no-daemon
      - name: Build test Agent
        run: ./gradlew :testing:agent-for-testing:shadowJar --no-daemon
      - name: Run Muzzle checks for configured Instrumentation modules
        shell: bash
        run: |
          while IFS= read -r module; do
            [[ -z "$module" ]] && continue
            ./gradlew "$module:muzzle" --no-daemon
          done < <(./gradlew -q :instrumentation:listMuzzleInstrumentations)
      - uses: actions/upload-artifact@v4
        with:
          name: datafox-javaagent
          path: |
            agent/build/libs/datafox-javaagent-*-all.jar
            agent/build/libs/datafox-javaagent-*.jar
          if-no-files-found: error

  smoke-test:
    needs: build-and-unit-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run packaged Agent smoke test
        run: ./gradlew :smoke-tests:test --no-daemon

  license-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate third-party license report
        run: ./gradlew :agent:generateLicenseReport --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: datafox-license-report
          path: licenses/
          if-no-files-found: warn
